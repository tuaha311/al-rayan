{% load static %}
<div id="flash-screen"
     style="position:fixed;inset:0;z-index:9999;background:#120401;overflow:hidden;"
     aria-hidden="true">
  <!-- canvas rendered at half resolution; CSS scales it up smoothly (bilinear) -->
  <canvas id="silk-canvas" style="position:absolute;top:0;left:0;width:100%;height:100%;display:block;image-rendering:auto;"></canvas>

  <div style="position:absolute;inset:0;z-index:1;background:linear-gradient(to bottom,rgba(0,0,0,.25) 0%,transparent 50%,rgba(0,0,0,.45) 100%);pointer-events:none;"></div>

  <div id="silk-content" style="position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .6s ease;">
    <img id="silk-logo" src="{% static 'images/logo-transparent.png' %}" alt="xeco"
         style="max-width:40%;max-height:40%;object-fit:contain;opacity:0;transform:translateY(1.5rem);transition:opacity 1s ease,transform 1s ease;" />
  </div>

  <div id="silk-corner" style="position:absolute;top:2rem;left:2rem;z-index:3;font-size:.75rem;font-weight:300;letter-spacing:.25em;text-transform:uppercase;color:rgba(156,163,175,.4);opacity:0;transform:translateY(-1rem);transition:opacity .9s ease .9s,transform .9s ease .9s;font-family:ui-serif,Georgia,Cambria,'Times New Roman',Times,serif;">
    2025
  </div>
</div>

<script>
(function () {
  var screen  = document.getElementById('flash-screen');
  var canvas  = document.getElementById('silk-canvas');
  var content = document.getElementById('silk-content');
  var logo    = document.getElementById('silk-logo');
  if (!screen || !canvas) return;

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var prevOverflow = document.documentElement.style.overflow;
  document.documentElement.style.overflow = 'hidden';

  function dismiss() {
    document.documentElement.style.overflow = prevOverflow;
    screen.style.transition = 'opacity .65s ease';
    screen.style.opacity    = '0';
    setTimeout(function() { if (screen.parentNode) screen.parentNode.removeChild(screen); }, 700);
  }

  if (reduce) { dismiss(); return; }

  // Half-resolution pixel buffer — CSS width/height:100% scales it up with
  // bilinear interpolation so there are no visible pixel blocks.
  var ctx = canvas.getContext('2d');
  var raf, time = 0;
  var speed = 0.02, scale = 2, noiseI = 0.8;

  function resize() {
    canvas.width  = Math.ceil(window.innerWidth  / 2);
    canvas.height = Math.ceil(window.innerHeight / 2);
  }
  resize();
  window.addEventListener('resize', resize);

  function noise(x, y) {
    var G = 2.71828;
    return (G * Math.sin(G * x) * G * Math.sin(G * y) * (1 + x)) % 1;
  }

  function tick() {
    var w = canvas.width, h = canvas.height;
    var img  = ctx.createImageData(w, h);
    var data = img.data;
    var tOff = speed * time;

    for (var x = 0; x < w; x++) {
      for (var y = 0; y < h; y++) {
        var u  = (x / w) * scale;
        var v  = (y / h) * scale;
        var tx = u;
        var ty = v + 0.03 * Math.sin(8.0 * tx - tOff);
        var pat = 0.6 + 0.4 * Math.sin(
          5.0 * (tx + ty + Math.cos(3.0 * tx + 5.0 * ty) + 0.02 * tOff) +
          Math.sin(20.0 * (tx + ty - 0.1 * tOff))
        );
        var intensity = Math.max(0, pat - noise(x, y) / 15.0 * noiseI);

        // Logo palette sampled exactly:
        //   edge  #120401 → rgb(18,  4,  1)
        //   mid   #2A0201 → rgb(42,  2,  1)
        //   inner (est.)  → rgb(80,  6,  2)
        // Peak silk maps to bright inner-glow crimson; troughs to edge dark.
        var r = (18  + 102 * intensity) | 0;   // 18 → 120
        var g = ( 4  +   4 * intensity) | 0;   //  4 →   8
        var b = ( 1  +   3 * intensity) | 0;   //  1 →   4

        var idx = (y * w + x) * 4;
        data[idx]   = r;
        data[idx+1] = g;
        data[idx+2] = b;
        data[idx+3] = 255;
      }
    }

    ctx.putImageData(img, 0, 0);

    // Radial vignette — darkens edges toward the exact logo corner colour
    var vig = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, Math.max(w, h) * 0.6);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(8,1,0,.6)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, w, h);

    time++;
    raf = requestAnimationFrame(tick);
  }

  raf = requestAnimationFrame(tick);

  // Fade in logo after first two frames so canvas has painted
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      content.style.opacity = '1';
      logo.style.opacity    = '1';
      logo.style.transform  = 'translateY(0)';
    });
  });

  setTimeout(function() {
    cancelAnimationFrame(raf);
    window.removeEventListener('resize', resize);
    dismiss();
  }, 2600);
})();
</script>
